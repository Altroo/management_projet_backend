# Production docker-compose configuration

services:
  redis:
    image: redis:latest
    container_name: management_projet_redis
    restart: always
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  web:
    build: .
    container_name: management_projet_web
    restart: always
    command: daphne -b 0.0.0.0 -p 8000 management_projet_backend.asgi:application
    ports:
      - "8003:8000"
    env_file:
      - .env
    volumes:
      - ./media:/app/media
      - ./static:/app/static
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ai-gateway:
    image: nginx:1.29.8-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    container_name: management_projet_ai_gateway
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./deploy/ai-gateway.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      backend:
      gateway:
        aliases:
          - ai-assistant-gateway
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,noexec,nosuid
      - /var/run:size=1m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  ai-model:
    image: ghcr.io/ggml-org/llama.cpp:server-b10991@sha256:79903855d3de1689e9856219283591be12ba6f40a8e65fc7223824109446ad88
    container_name: management_projet_ai_model
    profiles: ["ai"]
    restart: unless-stopped
    command:
      - --model
      - /models/Qwen3.6-35B-A3B-UD-Q5_K_M.gguf
      - --alias
      - qwen3.6-35b-a3b-q5_k_m
      - --ctx-size
      - "8192"
      - --parallel
      - "1"
      - --threads
      - "8"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --jinja
      - --no-webui
    expose:
      - "8080"
    volumes:
      - ./models:/models:ro
    networks:
      - backend
    mem_limit: 30g
    cpu_shares: 256
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  ai-translation:
    build:
      context: ./deploy/opus
    container_name: management_projet_ai_translation
    profiles: ["ai"]
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./translation-models:/models:ro
    environment:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
    networks:
      - backend
    mem_limit: 4g
    cpu_shares: 192
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  db:
    image: postgres:18
    container_name: management_projet_db
    restart: always
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    ports:
      - "5434:5432"
    expose:
      - "5432"
    env_file:
      - .env
    volumes:
      - management_projet_db_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery:
    build: .
    container_name: management_projet_celery
    restart: always
    command: celery -A management_projet_backend worker --loglevel=info --concurrency=4 -E -P gevent
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - backend
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./media:/app/media
      - ./static:/app/static

  celery-beat:
    build: .
    container_name: management_projet_celery_beat
    restart: always
    command: celery -A management_projet_backend beat --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - backend
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./media:/app/media
      - ./static:/app/static

volumes:
  management_projet_db_data:
  redis_data:

networks:
  backend:
    driver: bridge
  gateway:
    name: ebh-ai-gateway
    driver: bridge
