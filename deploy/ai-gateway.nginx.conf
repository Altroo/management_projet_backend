# All peer apps expose a Docker alias "web" on the shared gateway network.
# Use the unique backend name and refresh DNS when its container is replaced.
upstream management_ai_backend {
    zone management_ai_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    server management_projet_web:8000 resolve;
}

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 256k;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    location = /v1/assist {
        limit_except POST { deny all; }
        proxy_pass http://management_ai_backend/api/ai/internal/assist/;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 190s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }

    location = /v1/translate {
        limit_except POST { deny all; }
        proxy_pass http://management_ai_backend/api/ai/internal/translate/;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 190s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
